# Market Pulse card contents. Order is render order.

markets:
  - label: Crude Oil
    kind: yfinance
    symbol: "CL=F"
    format: "${:,.2f}"
  - label: 10-Yr Treasury
    kind: fred
    series: DGS10
    format: "{:.2f}%"
    change: bp          # show change in basis points instead of %
  - label: Gas (nat'l avg)
    kind: fred
    series: GASREGW     # weekly, Monday
    format: "${:.2f}/gal"
    weekly: true
  - label: Diesel (nat'l avg)
    kind: fred
    series: GASDESW     # weekly, Monday
    format: "${:.2f}/gal"
    weekly: true
  - label: 30-Yr Mortgage
    kind: fred
    series: MORTGAGE30US   # weekly, Thursday
    format: "{:.2f}%"
    weekly: true
    change: bp

container_rates:
  title: "Container Spot Rates"
  subtitle: "Weekly (Drewry WCI), WoW change shown"
  source_url: https://www.drewry.co.uk/supply-chain-advisors/supply-chain-expertise/world-container-index-assessed-by-drewry
  rows:
    - label: US West Coast
      key: shanghai_la
    - label: US East Coast
      key: shanghai_ny
    - label: WCI Composite (Global)
      key: composite

