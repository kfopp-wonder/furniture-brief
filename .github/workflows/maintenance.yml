name: Maintenance

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        required: true
        type: choice
        options:
          - check-feeds
          - check-substack
          - list-newsletters
          - backfill-history
          - test-offline
          - mock-run

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt

      - name: check-feeds
        if: inputs.task == 'check-feeds'
        run: |
          set +e
          python -m brief.main --check-feeds > feeds.txt 2>&1; RC=$?
          { echo '### Feed check'; echo '```'; cat feeds.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat feeds.txt
          { echo "# Feed check $(date -u +'%Y-%m-%d %H:%M UTC')"; echo; echo '```'; cat feeds.txt; echo '```'; } > state/feed_check.md
          git config user.name "furniture-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/feed_check.md
          git diff --cached --quiet || (git commit -m "feed check $(date -u +%Y-%m-%d)" && git pull --rebase origin main && git push)
          if [ $RC -ne 0 ]; then echo "::warning::one or more feeds returned an error (see state/feed_check.md)"; fi

      - name: check-substack
        if: inputs.task == 'check-substack'
        env:
          SUBSTACK_SID: ${{ secrets.SUBSTACK_SID }}
        run: |
          python -m brief.main --check-substack > substack.txt 2>&1 || true
          cat substack.txt
          { echo "# Substack auth check $(date -u +'%Y-%m-%d %H:%M UTC')"; echo; echo '```'; cat substack.txt; echo '```'; } > state/substack_check.md
          git config user.name "furniture-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/substack_check.md
          git diff --cached --quiet || (git commit -m "substack auth check" && git pull --rebase origin main && git push)

      - name: list-newsletters
        if: inputs.task == 'list-newsletters'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NEWSLETTER_IMAP_USER: ${{ secrets.NEWSLETTER_IMAP_USER }}
          NEWSLETTER_IMAP_PASS: ${{ secrets.NEWSLETTER_IMAP_PASS }}
        run: |
          python -m brief.main --list-newsletters > senders.txt 2>&1 || true
          cat senders.txt
          { echo "# Newsletter senders, last 14 days ($(date -u +'%Y-%m-%d'))"; echo; echo 'Senders with a List-Unsubscribe header, most frequent first. Copy the ones you want into config/newsletters.yaml.'; echo; echo '```'; cat senders.txt; echo '```'; } > state/newsletter_senders.md
          git config user.name "furniture-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/newsletter_senders.md
          git diff --cached --quiet || (git commit -m "newsletter sender scan" && git pull --rebase origin main && git push)

      - name: test-offline
        if: inputs.task == 'test-offline'
        run: |
          python tests/test_offline.py 2>&1 | tee tests.txt
          { echo '### Offline tests'; echo '```'; tail -5 tests.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: mock-run
        if: inputs.task == 'mock-run'
        run: |
          python -m brief.main --mock --date 2026-09-17
          git checkout -- state/ docs/ 2>/dev/null || true

      - name: backfill-history
        if: inputs.task == 'backfill-history'
        run: |
          python scripts/backfill_history.py
          git config user.name "furniture-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/history.jsonl
          git diff --cached --quiet || (git commit -m "backfill dedupe history from Substack archive" && git push)

      - name: Upload outputs
        if: always() && inputs.task == 'mock-run'
        uses: actions/upload-artifact@v4
        with:
          name: mock-run
          path: out/
          if-no-files-found: ignore
